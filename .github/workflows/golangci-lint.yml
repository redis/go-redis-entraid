name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in sync with the Go version golangci-lint is built with.
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
